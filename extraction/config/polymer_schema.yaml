# Stage 5 表征方法规范名与常见原文写法。
characterization_methods:
  FTIR:
    aliases: [FTIR, Fourier transform infrared spectroscopy, infrared spectroscopy, infrared absorption, IR spectra]
  NMR:
    aliases: [NMR, nuclear magnetic resonance, 1H NMR, 13C NMR]
  GPC:
    aliases: [GPC, gel permeation chromatography, size exclusion chromatography]
  DSC:
    aliases: [DSC, differential scanning calorimetry]
  DMA:
    aliases: [DMA, dynamic mechanical analysis]
  dilatometry:
    aliases: [dilatometry, dilatometric, dila-tometric, dilatometrically, dilatometer, dilatometer measurement]
  TGA:
    aliases: [TGA, thermogravimetric analysis, thermal degradation]
  XRD:
    aliases: [XRD, X-ray diffraction, X-ray diffractions]
  SEM:
    aliases: [SEM, scanning electron microscopy]
  TEM:
    aliases: [TEM, transmission electron microscopy]
  AFM:
    aliases: [AFM, atomic force microscopy]
  Raman:
    aliases: [Raman, Raman spectroscopy]
  SAXS:
    aliases: [SAXS, small-angle X-ray scattering]
  UV-Vis:
    aliases: [UV-Vis, ultraviolet-visible spectroscopy]
  viscometry:
    aliases: [viscometry, viscosity measurement, viscosity measurements, intrinsic viscosity measurement, Ubbelohde viscometer, Ubbelohde-type viscometer, '[\eta]', '[\eta_{\text{max}}]']
  turbidimetry:
    aliases: [turbidimetry, turbidiometric titration, '[\Phi]', '[\Phi_{\text{max}}]']
  swelling:
    aliases: [swelling, swelling measurement, swelling measurements, equilibrium swelling, '[Q]', '[Q_{\text{max}}]']

